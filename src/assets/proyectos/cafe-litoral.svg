<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Café Litoral — IDENTIDAD VISUAL">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFC93C"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#g)"/>
  
    <path d="M0 470 Q150 400 300 470 T600 470 T900 470 T1200 470 V0 H0 Z" fill="#FFFFFF" opacity="0.10"/>
    <path d="M0 330 Q150 260 300 330 T600 330 T900 330 T1200 330 V0 H0 Z" fill="#FFFFFF" opacity="0.14"/>
    <path d="M0 190 Q150 120 300 190 T600 190 T900 190 T1200 190 V0 H0 Z" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="990" cy="150" r="75" fill="#FFFFFF" opacity="0.26"/>
  <rect width="1200" height="900" fill="url(#scrim)"/>

  <!-- Texto del cartel -->
  <g font-family="Outfit, 'Segoe UI', system-ui, sans-serif" fill="#FFFFFF">
    <text x="90" y="612" font-size="24" font-weight="600" letter-spacing="6" opacity="0.88">IDENTIDAD VISUAL</text>
    <text x="90" y="694" font-size="62" font-weight="700" letter-spacing="-1.5">Café Litoral</text>
    <rect x="90" y="730" width="130" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
