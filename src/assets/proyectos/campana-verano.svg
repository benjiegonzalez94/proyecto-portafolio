<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Verano — CAMPAÑA DIGITAL">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#g)"/>
  
    <circle cx="900" cy="230" r="190" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="900" cy="230" r="125" fill="#FFFFFF" opacity="0.22"/>
    <circle cx="900" cy="230" r="62" fill="#FF2D78" opacity="0.85"/>
    <circle cx="300" cy="180" r="90" fill="#FFFFFF" opacity="0.14"/>
  <rect width="1200" height="900" fill="url(#scrim)"/>

  <!-- Texto del cartel -->
  <g font-family="Outfit, 'Segoe UI', system-ui, sans-serif" fill="#FFFFFF">
    <text x="90" y="612" font-size="24" font-weight="600" letter-spacing="6" opacity="0.88">CAMPAÑA DIGITAL</text>
    <text x="90" y="694" font-size="62" font-weight="700" letter-spacing="-1.5">Verano</text>
    <rect x="90" y="730" width="130" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
