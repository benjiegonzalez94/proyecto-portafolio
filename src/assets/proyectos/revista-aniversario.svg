<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Revista 25 Años — EDITORIAL">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#FF2D78"/>
    </linearGradient>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#g)"/>
  <rect x="720" y="310" width="80" height="250" rx="40" fill="#FFFFFF" opacity="0.16"/>
    <rect x="850" y="180" width="80" height="380" rx="40" fill="#FFFFFF" opacity="0.24"/>
    <rect x="980" y="380" width="80" height="180" rx="40" fill="#FFFFFF" opacity="0.32"/>
    <rect x="1110" y="240" width="80" height="320" rx="40" fill="#FFFFFF" opacity="0.40"/>
    <circle cx="240" cy="190" r="80" fill="#FFFFFF" opacity="0.16"/>
  <rect width="1200" height="900" fill="url(#scrim)"/>

  <!-- Texto del cartel -->
  <g font-family="Outfit, 'Segoe UI', system-ui, sans-serif" fill="#FFFFFF">
    <text x="90" y="612" font-size="24" font-weight="600" letter-spacing="6" opacity="0.88">EDITORIAL</text>
    <text x="90" y="694" font-size="50" font-weight="700" letter-spacing="-1.5">Revista 25 Años</text>
    <rect x="90" y="730" width="130" height="8" rx="4" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
