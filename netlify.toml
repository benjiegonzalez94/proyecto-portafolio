# Configuración de despliegue en Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Netlify leerá este archivo automáticamente al conectar el repositorio.
# No necesitas configurar nada a mano en el panel.

[build]
  # Comando que genera el sitio
  command = "npm run build"
  # Carpeta con el resultado que se publica
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Desactiva la telemetría de Astro durante el build
  ASTRO_TELEMETRY_DISABLED = "1"

# Cabeceras de seguridad para todas las páginas
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Los archivos generados por Astro llevan un hash en el nombre, así que se
# pueden cachear para siempre: si cambian, cambia el nombre del archivo.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML no se cachea, para que los cambios se vean de inmediato
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
