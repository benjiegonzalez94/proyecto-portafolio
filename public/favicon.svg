<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Gradiente oficial de Folio: Azul Eléctrico a Celeste Vibrante -->
    <linearGradient id="folio-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Contenedor cuadrado con esquinas redondeadas modernas -->
  <rect width="64" height="64" rx="16" fill="url(#folio-grad)" />

  <!-- Acento de brillo sutil en el borde superior -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Letra "F" geométrica, moderna y audaz de Folio -->
  <path d="M22 17h22a2 2 0 0 1 2 2v3.5a2 2 0 0 1-2 2H28.5v7H40a2 2 0 0 1 2 2V37a2 2 0 0 1-2 2H28.5v8a2 2 0 0 1-2 2H23a2 2 0 0 1-2-2V19a2 2 0 0 1 2-2z" fill="#ffffff" filter="url(#shadow)" />

  <!-- Punto de energía / innovación en la parte superior derecha de la F -->
  <circle cx="43" cy="21.5" r="2.5" fill="#38BDF8" />
</svg>
