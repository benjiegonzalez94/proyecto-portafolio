<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-net" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg-net)"/>
  <!-- Topología de Red -->
  <line x1="400" y1="160" x2="250" y2="280" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6"/>
  <line x1="400" y1="160" x2="550" y2="280" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6"/>
  <line x1="250" y1="280" x2="180" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="250" y1="280" x2="320" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="550" y1="280" x2="480" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="550" y1="280" x2="620" y2="380" stroke="#38bdf8" stroke-width="2"/>

  <!-- Servidor Central -->
  <rect x="350" y="110" width="100" height="80" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="375" cy="140" r="5" fill="#22c55e"/>
  <circle cx="395" cy="140" r="5" fill="#38bdf8"/>
  <circle cx="415" cy="140" r="5" fill="#f59e0b"/>
  <line x1="365" y1="160" x2="435" y2="160" stroke="#bae6fd" stroke-width="2"/>

  <!-- Nodos Switches -->
  <rect x="210" y="250" width="80" height="55" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="510" y="250" width="80" height="55" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>

  <!-- Nodos Terminales -->
  <circle cx="180" cy="380" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="320" cy="380" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="480" cy="380" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="620" cy="380" r="20" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

  <text x="400" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">Monitoreo &amp; Infraestructura Cloud / LAN</text>
</svg>
